<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Title Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Animated Dynamic Stream Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes waveFlow1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveFlow2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }
    .wave1 { animation: waveFlow1 10s ease-in-out infinite; }
    .wave2 { animation: waveFlow2 14s ease-in-out infinite; }
    .pulse-dot { animation: pulseGlow 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  </style>

  <!-- SOLID SVG BACKGROUND RECTANGLE -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)"/>

  <!-- DYNAMIC ANIMATED BACKGROUND LAYER -->
  <g opacity="0.4">
    <!-- Grid pattern lines -->
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>

    <line x1="200" y1="0" x2="200" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="400" y1="0" x2="400" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="800" y1="0" x2="800" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>

    <!-- Wave lines -->
    <path class="wave1" d="M -50,260 Q 250,160 550,260 T 1150,210" fill="none" stroke="url(#streamGrad1)" stroke-width="3" stroke-dasharray="15 10"/>
    <path class="wave2" d="M -50,110 Q 350,210 750,110 T 1250,180" fill="none" stroke="url(#streamGrad2)" stroke-width="3" stroke-dasharray="20 12"/>

    <!-- Floating animated particles -->
    <circle cx="140" cy="110" r="5" fill="#38bdf8" class="pulse-dot"/>
    <circle cx="980" cy="80" r="6" fill="#818cf8" class="pulse-dot" style="animation-delay: 1s;"/>
    <circle cx="1060" cy="270" r="5" fill="#c084fc" class="pulse-dot" style="animation-delay: 2s;"/>
    <circle cx="260" cy="280" r="7" fill="#38bdf8" class="pulse-dot" style="animation-delay: 1.5s;"/>
  </g>

  <!-- FOREGROUND CONTENT LAYER (Guaranteed High Contrast Text & Visual Elements) -->
  <g transform="translate(60, 0)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="225" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="26" y="18" fill="#e2e8f0" font-size="11" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="0.5">OPEN-SOURCE &amp; SAAS ECOSYSTEM</text>
    </g>

    <!-- Main Title Text -->
    <text x="0" y="130" fill="url(#titleGrad)" font-size="38" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="-0.5">
      Awesome Video Packaging &amp; Origination
    </text>

    <!-- Subtitle Text -->
    <text x="0" y="170" fill="#94a3b8" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      Curated List of JIT Packaging, Live Encoding, Manifest Manipulation, SSAI &amp; Origin Servers
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: HLS / DASH -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="55" y="19" fill="#38bdf8" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">HLS / DASH</text>
      </g>

      <!-- Pill 2: CMAF -->
      <g transform="translate(122, 0)">
        <rect x="0" y="0" width="80" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
        <text x="40" y="19" fill="#818cf8" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">CMAF</text>
      </g>

      <!-- Pill 3: Multi-DRM -->
      <g transform="translate(214, 0)">
        <rect x="0" y="0" width="110" height="30" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
        <text x="55" y="19" fill="#c084fc" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Multi-DRM</text>
      </g>

      <!-- Pill 4: SSAI & Dynamic Ads -->
      <g transform="translate(336, 0)">
        <rect x="0" y="0" width="150" height="30" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
        <text x="75" y="19" fill="#f472b6" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">SSAI &amp; Ad Insertion</text>
      </g>

      <!-- Pill 5: Origin Servers -->
      <g transform="translate(498, 0)">
        <rect x="0" y="0" width="125" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
        <text x="62" y="19" fill="#34d399" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Origin Servers</text>
      </g>
    </g>

    <!-- Bottom Metadata Bar -->
    <text x="0" y="290" fill="#64748b" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      🚀 Updated for 2026  •  ⚡ Just-in-Time Packaging  •  🛡️ DRM &amp; SSAI  •  🌐 Cloud &amp; Open-Source
    </text>

  </g>
</svg>
