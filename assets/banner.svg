<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Background Gradients & Glows -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic Animated Elements (Background Layer Only) */
    @keyframes waveMove1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-60px); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-wave1 { animation: waveMove1 12s ease-in-out infinite; }
    .animated-wave2 { animation: waveMove2 16s ease-in-out infinite; }
    .pulse-dot { animation: pulseParticle 4s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 20 15; animation: dashStream 25s linear infinite; }
  </style>

  <!-- BACKGROUND GRAPHICS (Dynamic Animated Streams) -->
  <g opacity="0.35">
    <!-- Grid Pattern -->
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#334155" stroke-width="0.5" stroke-opacity="0.5"/>
    <path d="M 200,0 L 200,360 M 400,0 L 400,360 M 600,0 L 600,360 M 800,0 L 800,360 M 1000,0 L 1000,360" stroke="#334155" stroke-width="0.5" stroke-opacity="0.5"/>

    <!-- Animated Dynamic Waves -->
    <path class="animated-wave1 stream-line" d="M -100,260 Q 200,180 500,270 T 1100,200 T 1300,280" fill="none" stroke="url(#streamGrad1)" stroke-width="4"/>
    <path class="animated-wave2 stream-line" d="M -100,100 Q 300,220 700,120 T 1300,190" fill="none" stroke="url(#streamGrad2)" stroke-width="3"/>
    
    <!-- Floating Glowing Data Nodes -->
    <circle cx="150" cy="120" r="4" fill="#38bdf8" class="pulse-dot" style="animation-delay: 0s;"/>
    <circle cx="950" cy="90" r="5" fill="#818cf8" class="pulse-dot" style="animation-delay: 1s;"/>
    <circle cx="1080" cy="260" r="4" fill="#c084fc" class="pulse-dot" style="animation-delay: 2s;"/>
    <circle cx="280" cy="290" r="6" fill="#38bdf8" class="pulse-dot" style="animation-delay: 1.5s;"/>
    <circle cx="800" cy="280" r="3" fill="#ec4899" class="pulse-dot" style="animation-delay: 0.5s;"/>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed High Contrast & Visible Foreground) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#10b981"/>
      <text x="28" y="18" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">OPEN-SOURCE &amp; SAAS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#titleGrad)" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#lightGlow)">
      Awesome Video Packaging &amp; Origination
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#94a3b8" font-size="17" font-weight="400" letter-spacing="0.2">
      Curated List of JIT Packaging, Live Encoding, Manifest Manipulation, SSAI &amp; Origin Servers
    </text>

    <!-- Tech Tag Pills in Foreground -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: HLS & DASH -->
      <rect x="0" y="0" width="115" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="57" y="21" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">HLS / DASH</text>

      <!-- Pill 2: CMAF -->
      <rect x="127" y="0" width="85" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
      <text x="169" y="21" fill="#818cf8" font-size="13" font-weight="700" text-anchor="middle">CMAF</text>

      <!-- Pill 3: DRM Signaling -->
      <rect x="224" y="0" width="130" height="32" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
      <text x="289" y="21" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">DRM Signaling</text>

      <!-- Pill 4: SSAI & Ad Insertion -->
      <rect x="366" y="0" width="155" height="32" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1.2"/>
      <text x="443" y="21" fill="#f472b6" font-size="13" font-weight="700" text-anchor="middle">SSAI &amp; Ad Insertion</text>

      <!-- Pill 5: Origin Servers -->
      <rect x="533" y="0" width="130" height="32" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
      <text x="598" y="21" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">Origin Servers</text>
    </g>

    <!-- Bottom Feature Bar -->
    <text x="0" y="290" fill="#64748b" font-size="13" font-weight="500">
      🚀 Updated for 2026 &nbsp;|&nbsp; ⚡ Just-in-Time Packaging &nbsp;|&nbsp; 🛡️ Multi-DRM &amp; SSAI &nbsp;|&nbsp; 🌐 Cloud &amp; On-Prem
    </text>
  </g>
</svg>
